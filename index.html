<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Updater</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        textarea {
            width: 80%;
            min-height: 100px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box; /* Include padding and border in element's total width and height */
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Update File Content</h1>

    <form action="/submit" method="POST">
        <div>
            <label for="textInput">Enter text to save:</label>
            <textarea id="textInput" name="textInput" required></textarea>
        </div>
        <div>
            <button type="submit">Update File</button>
        </div>
    </form>

</body>
</html>
